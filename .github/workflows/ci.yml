name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: PR Skills Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm security:audit

      - name: Lint workspace and typecheck
        run: pnpm lint

      - name: Check change record
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            pnpm check:changelog -- --from "$BASE_SHA" --to "$GITHUB_SHA"
          else
            pnpm check:changelog
          fi
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

      - name: Check commit messages
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            pnpm commitlint -- --from "$BASE_SHA" --to "$GITHUB_SHA"
          else
            pnpm commitlint
          fi
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

      - name: Secret scan
        run: pnpm security:secrets

      - name: Unit tests
        run: pnpm test:unit

      - name: Integration tests
        run: pnpm test:integration

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Build
        run: pnpm build
